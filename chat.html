<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой ИИ (локальный)</title>
<style>
  :root{--bg:#0e1016;--panel:#171a23;--ink:#e7e9ee;--muted:#8a90a0;--accent:#6c8cff;--me:#243049;--bot:#1c2030;--line:#262b38;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;}
  header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  header b{font-size:15px;}
  header .dot{width:8px;height:8px;border-radius:50%;background:#3ad07a;box-shadow:0 0 8px #3ad07a;}
  header .model{color:var(--muted);font-size:12px;margin-left:auto;}
  #log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
  .me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px;}
  .bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .sys{align-self:center;color:var(--muted);font-size:13px;}
  footer{padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;height:46px;max-height:160px;}
  textarea:focus{outline:none;border-color:var(--accent);}
  button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .row{display:flex;gap:8px;align-items:center;}
  .link{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12px;}
</style>
</head>
<body>
  <header>
    <span class="dot"></span><b>Мой локальный ИИ</b>
    <span class="model">qwen2.5:7b · на домашнем ПК · <span class="link" onclick="changePass()">пароль</span> · <span class="link" onclick="clearChat()">очистить</span></span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="inp" placeholder="Напиши сообщение…  (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button id="send" onclick="send()">▶</button>
  </footer>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const btn = document.getElementById('send');
let history = [];
let pass = localStorage.getItem('chatpass') || '';

if (!pass) changePass();
function changePass(){
  const p = prompt('Пароль для доступа к боту (тот, что в server.js):', pass || '');
  if (p !== null){ pass = p; localStorage.setItem('chatpass', p); }
}
function clearChat(){ history = []; log.innerHTML = ''; addSys('Диалог очищен'); }

function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function addSys(t){ addMsg('sys', t); }

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
inp.addEventListener('input', () => {
  inp.style.height = '46px'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
});

async function send(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '46px';
  addMsg('me', text);
  history.push({ role: 'user', content: text });

  btn.disabled = true;
  const botDiv = addMsg('bot', '');
  let acc = '';
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass, messages: history })
    });
    if (r.status === 401){ botDiv.textContent = '🔒 Неверный пароль. Нажми «пароль» вверху.'; btn.disabled = false; return; }
    if (!r.ok){ botDiv.textContent = '⚠️ Ошибка: ' + r.status; btn.disabled = false; return; }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        try {
          const j = JSON.parse(line);
          if (j.message && j.message.content){ acc += j.message.content; botDiv.textContent = acc; log.scrollTop = log.scrollHeight; }
        } catch(_) {}
      }
    }
    history.push({ role: 'assistant', content: acc });
  } catch(e){
    botDiv.textContent = '⚠️ Не достучался до сервера: ' + e.message;
  }
  btn.disabled = false; inp.focus();
}

addSys('Готов. Пиши — отвечает нейросеть на твоём домашнем ПК.');
</script>
</body>
</html>
